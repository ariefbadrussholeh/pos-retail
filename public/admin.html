<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin</title>
<script src="/js/theme.js"></script>
<link rel="stylesheet" href="/css/base.css">
<link rel="stylesheet" href="/css/admin.css">
</head>
<body>
<div class="shell" id="shell">
  <aside class="side" id="side">
    <div class="brand" id="brand"></div>
    <nav id="nav" aria-label="Menu utama"></nav>
  </aside>
  <div class="scrim" id="scrim"></div>
  <div class="main">
    <header class="topbar">
      <button class="icon" id="menu" aria-label="Ciutkan atau tampilkan menu" title="Menu"></button>
      <div class="storebox" id="storebox"></div>
      <div class="spacer"></div>
      <a href="/pos.html" class="btn sm primary" id="toPos" title="Buka layar kasir">Kasir</a>
      <span id="themeSlot"></span>
      <div class="um">
        <button class="um-btn" id="umBtn" aria-haspopup="menu" aria-expanded="false"><span class="av" id="meAv"></span><span class="um-t"><b id="meName"></b><small id="meRole"></small></span><span class="chev"></span></button>
        <div class="um-menu hidden" id="umMenu" role="menu"><button id="pw" role="menuitem">Ganti password</button><button id="out" role="menuitem">Keluar</button></div>
      </div>
    </header>
    <main class="content"><div id="view"></div></main>
  </div>
</div>
<script src="/js/common.js"></script>
<script src="/js/admin-core.js"></script>
<script src="/js/admin-data.js"></script>
<script src="/js/admin-trx.js"></script>
<script src="/js/admin-extra.js"></script>
</body>
</html>
